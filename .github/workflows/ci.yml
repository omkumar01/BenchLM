name: BenchLM CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "1.8.0"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run Ruff linter
        run: |
          uv run ruff check .

      - name: Run Ruff formatter check
        run: |
          uv run ruff format --check .

      - name: Run MyPy type checker
        run: |
          uv run mypy benchlm/

      - name: Run tests
        run: |
          uv run pytest tests/ -v --tb=short --cov=benchlm --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Flet
        run: uv add flet

      - name: Build Linux
        run: |
          cd ${{ github.workspace }}
          flet build linux --verbose

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchlm-linux
          path: build/linux/
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Flet
        run: uv add flet

      - name: Build macOS
        run: |
          cd ${{ github.workspace }}
          flet build macos --verbose

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchlm-macos
          path: build/macos/
          retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Flet
        run: uv add flet

      - name: Build Windows
        run: |
          cd ${{ github.workspace }}
          flet build windows --verbose

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchlm-windows
          path: build/windows/
          retention-days: 30

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Flet
        run: uv add flet

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android
        run: |
          cd ${{ github.workspace }}
          flet build android --verbose

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchlm-android
          path: build/android/
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: lint-and-test
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install Flet
        run: uv add flet

      - name: Build iOS
        run: |
          cd ${{ github.workspace }}
          flet build ios --verbose

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchlm-ios
          path: build/ios/
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, build-android, build-ios]
    if: github.event_name == 'release'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Assets
        run: |
          ls -la artifacts/

      - name: Update Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/benchlm-linux/**/*
            artifacts/benchlm-macos/**/*
            artifacts/benchlm-windows/**/*
            artifacts/benchlm-android/**/*
            artifacts/benchlm-ios/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' || github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            benchlm/benchlm:latest
            benchlm/benchlm:${{ github.sha }}
            benchlm/benchlm:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-linux, build-macos, build-windows]
    if: failure()

    steps:
      - name: Send notification
        run: |
          echo "Build failed! Check GitHub Actions for details."
          # Add Slack/Discord/Email notification here
[project]
name = "benchlm"
version = "0.1.0"
description = "Professional offline LLM benchmarking suite"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "BenchLM Team", email = "benchlm@example.com"}
]
keywords = ["llm", "benchmark", "ollama", "llama.cpp", "flet", "plotly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # UI Framework
    "flet>=0.24.0",
    # Data Processing
    "polars>=1.12.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    # Database
    "sqlmodel>=0.0.21",
    "alembic>=1.13.0",
    # HTTP Client
    "httpx>=0.27.0",
    # Hardware Monitoring
    "psutil>=6.0.0",
    "pynvml>=11.5.0",
    # Configuration
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    # Logging
    "loguru>=0.7.2",
    # Charts
    "plotly>=5.23.0",
    "kaleido>=0.2.1",
    # Quality Metrics
    "evaluate>=0.4.3",
    "bert-score>=0.3.13",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    # Export
    "reportlab>=4.2.0",
    "weasyprint>=61.2",
    "jinja2>=3.1.4",
    # Utils
    "python-dateutil>=2.9.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.13.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
all = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.13.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
benchlm = "app:main"
benchlm-dev = "app:dev_main"

[build-system]
requires = ["hatchling>=1.22.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchlm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py313"
lint.select = ["E", "F", "I", "UP", "W", "C4", "C9", "T20", "SIM", "PL", "PTH", "ERA", "PT", "RET", "FLY"]
lint.ignore = ["S101", "PLB011", "PTH123", "ERA001", "T201", "T203"]
format.quote-style = "double"
format.indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.flet]
target = "benchlm:app"
product_name = "BenchLM"
org_name = "BenchLM"
product_version = "0.1.0"
description = "Professional offline LLM benchmarking suite"
icon = "assets/icon.png"
splash_screen = "assets/splash.png"
android_package = "com.benchlm.app"
ios_bundle_id = "com.benchlm.app"
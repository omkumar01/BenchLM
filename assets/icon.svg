<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#grad)" />
  
  <!-- Speed lines -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="128" x2="80" y2="128" />
    <line x1="40" y1="100" x2="75" y2="100" />
    <line x1="40" y1="156" x2="75" y2="156" />
    
    <!-- Chart bars -->
    <rect x="120" y="80" width="16" height="100" fill="#FFFFFF" opacity="0.9" rx="2"/>
    <rect x="148" y="60" width="16" height="120" fill="#FFFFFF" opacity="0.7" rx="2"/>
    <rect x="176" y="100" width="16" height="80" fill="#FFFFFF" opacity="0.5" rx="2"/>
    <rect x="204" y="50" width="16" height="130" fill="#FFFFFF" opacity="0.9" rx="2"/>
  </g>
  
  <!-- Benchmark text -->
  <text x="128" y="210" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="0.9">BenchLM</text>
</svg>
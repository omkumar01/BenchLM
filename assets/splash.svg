<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#18181B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#grad)" />
  
  <!-- Decorative elements -->
  <g opacity="0.1">
    <circle cx="200" cy="200" r="150" fill="url(#grad2)" />
    <circle cx="824" cy="824" r="200" fill="url(#grad2)" />
  </g>
  
  <!-- Center content -->
  <g transform="translate(512, 512)">
    <!-- Logo icon -->
    <g stroke="url(#grad2)" stroke-width="8" stroke-linecap="round">
      <line x1="-60" y1="0" x2="-20" y2="0" />
      <line x1="-60" y1="-30" x2="-25" y2="-30" />
      <line x1="-60" y1="30" x2="-25" y2="30" />
    </g>
    
    <!-- Chart bars -->
    <g fill="url(#grad2)">
      <rect x="40" y="-60" width="20" height="120" rx="4"/>
      <rect x="70" y="-80" width="20" height="140" rx="4" opacity="0.8"/>
      <rect x="100" y="-40" width="20" height="100" rx="4" opacity="0.6"/>
      <rect x="130" y="-90" width="20" height="150" rx="4"/>
    </g>
    
    <!-- Title -->
    <text x="0" y="180" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="#FAFAFA" text-anchor="middle" letter-spacing="2">BenchLM</text>
    
    <!-- Subtitle -->
    <text x="0" y="240" font-family="system-ui, sans-serif" font-size="24" fill="#A1A1AA" text-anchor="middle">LLM Benchmarking Suite</text>
    
    <!-- Version -->
    <text x="0" y="300" font-family="system-ui, sans-serif" font-size="18" fill="#71717A" text-anchor="middle">Version 0.1.0</text>
  </g>
  
  <!-- Loading indicator -->
  <g transform="translate(512, 850)">
    <circle cx="0" cy="0" r="20" stroke="url(#grad2)" stroke-width="4" fill="none" stroke-dasharray="90 30">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="50" font-family="system-ui, sans-serif" font-size="16" fill="#A1A1AA" text-anchor="middle">Loading...</text>
  </g>
</svg>